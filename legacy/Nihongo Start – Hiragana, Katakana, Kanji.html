<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nihongo Start – Hiragana, Katakana, Kanji</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#222;--mu:#6b6b6b;--ac:#c8372d;--bd:#e6dfd3;--ok:#2e7d32;--no:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161a;--card:#222126;--tx:#f1eee8;--mu:#a49f96;--ac:#ff6b5e;--bd:#37353c;--ok:#7bd88f;--no:#ff8a80}}
:root[data-theme="dark"]{--bg:#17161a;--card:#222126;--tx:#f1eee8;--mu:#a49f96;--ac:#ff6b5e;--bd:#37353c;--ok:#7bd88f;--no:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--mu);margin:2px 0 14px;font-size:.95rem}
select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center}
.cell b{display:block;font-size:2rem;font-weight:500;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
.cell span{color:var(--mu);font-size:.85rem}
.empty{visibility:hidden}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.k b{font-size:2.4rem;font-weight:500;float:right;margin-left:8px;color:var(--ac);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
.k small{color:var(--mu);display:block}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;text-align:center}
.big{font-size:5rem;line-height:1.1;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.opts button{padding:12px}
.ok{border-color:var(--ok)!important;color:var(--ok)}
.no{border-color:var(--no)!important;color:var(--no)}
ul.tips{text-align:left;padding-left:20px}
.note{color:var(--mu);font-size:.85rem;margin-top:14px}
.fc{position:relative;width:min(100%,320px);height:390px;margin:0 auto 12px;perspective:1000px;cursor:pointer}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s;background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.fcb{transform:rotateY(-180deg)}
.fc.fl .fcf{transform:rotateY(180deg)}
.fc.fl .fcb{transform:rotateY(0)}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fi{to{opacity:1}}
svg text{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
</style>
</head>
<body>
<main>
<header>
 <h1>日本語 Nihongo Start</h1>
 <select id="lang" aria-label="Language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select>
</header>
<p class="sub" id="sub"></p>
<nav id="nav"></nav>
<section id="view"></section>
<p class="note" id="note"></p>
</main>
<script>
const T={
pt:{sub:"Aprenda a escrever e ler japonês passo a passo.",hira:"Hiragana",kata:"Katakana",kanji:"Kanji",quiz:"Quiz",tips:"Dicas",on:"On’yomi",kun:"Kun’yomi",tap:"Toque em um caractere para ouvir.",score:"Pontos",next:"Próxima",set:"Treinar",note:"Base editável: adicione novos idiomas no objeto T e novos kanji na lista K.",
tl:["Aprenda 5 caracteres por dia, em fileiras (a, ka, sa…).","Escreva à mão seguindo a ordem dos traços: de cima para baixo, da esquerda para a direita.","Crie histórias para memorizar (ex.: さ parece uma pessoa sentada).","Revise com o quiz todos os dias, em sessões curtas.","Depois dos kana, leia palavras simples e aprenda kanji com palavras, não isolados."]},
en:{sub:"Learn to read and write Japanese step by step.",hira:"Hiragana",kata:"Katakana",kanji:"Kanji",quiz:"Quiz",tips:"Tips",on:"On’yomi",kun:"Kun’yomi",tap:"Tap a character to hear it.",score:"Score",next:"Next",set:"Practice",note:"Editable base: add languages to object T and kanji to list K.",
tl:["Learn 5 characters a day, row by row (a, ka, sa…).","Write by hand following stroke order: top to bottom, left to right.","Make up stories to remember them (e.g. さ looks like a person sitting).","Review with the quiz daily in short sessions.","After kana, read simple words and learn kanji inside words, not in isolation."]},
es:{sub:"Aprende a leer y escribir japonés paso a paso.",hira:"Hiragana",kata:"Katakana",kanji:"Kanji",quiz:"Quiz",tips:"Consejos",on:"On’yomi",kun:"Kun’yomi",tap:"Toca un carácter para oírlo.",score:"Puntos",next:"Siguiente",set:"Practicar",note:"Base editable: añade idiomas al objeto T y kanji a la lista K.",
tl:["Aprende 5 caracteres al día, fila por fila (a, ka, sa…).","Escribe a mano siguiendo el orden de trazos: de arriba abajo, de izquierda a derecha.","Inventa historias para recordarlos (p. ej. さ parece una persona sentada).","Repasa con el quiz cada día en sesiones cortas.","Tras los kana, lee palabras simples y aprende kanji dentro de palabras, no aislados."]}};
const H="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん".split("");
const R="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n".split(" ");
const Kt=H.map(c=>String.fromCharCode(c.charCodeAt(0)+96));
// [kanji, pt, en, es, on, kun]
const K=[["日","dia, sol","day, sun","día, sol","ニチ","ひ"],["月","lua, mês","moon, month","luna, mes","ゲツ","つき"],["火","fogo","fire","fuego","カ","ひ"],["水","água","water","agua","スイ","みず"],["木","árvore","tree","árbol","モク","き"],["金","ouro, dinheiro","gold, money","oro, dinero","キン","かね"],["土","terra","earth","tierra","ド","つち"],["人","pessoa","person","persona","ジン","ひと"],["大","grande","big","grande","ダイ","おお"],["小","pequeno","small","pequeño","ショウ","ちい"],["山","montanha","mountain","montaña","サン","やま"],["川","rio","river","río","セン","かわ"],["口","boca","mouth","boca","コウ","くち"],["目","olho","eye","ojo","モク","め"],["手","mão","hand","mano","シュ","て"],["一","um","one","uno","イチ","ひと"],["二","dois","two","dos","ニ","ふた"],["三","três","three","tres","サン","みっ"],["学","estudar","study","estudiar","ガク","まな"],["生","vida, nascer","life, be born","vida, nacer","セイ","い・う"]];
const LI={pt:1,en:2,es:3};
let L="pt",tab="trail",qset="hira",score=0,total=0,q=null;
const $=s=>document.querySelector(s);
let SPD=1;const say=(t,r)=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=r||SPD;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
function kanaGrid(arr){
 // layout rows of 5; ya yu yo and wa wo n use gaps
 const rows=[[0,5],[5,10],[10,15],[15,20],[20,25],[25,30],[30,35],[35,38],[38,43],[43,46]];
 let h='<p class="note" style="margin:0 0 10px">'+T[L].tap+'</p><div class="grid">';
 rows.forEach(([a,b])=>{
  const sl=arr.slice(a,b);
  const pad=a===35?[0,'x',1,'x',2]:a===43?[0,'x','x',1,2]:a===45?[]:null;
  if(a===30){} 
  let cells=sl.map((c,i)=>[c,R[a+i]]);
  if(a===35)cells=[cells[0],null,cells[1],null,cells[2]];
  if(a===43)cells=[cells[0],cells[1],cells[2],null,null].slice(0,5);
  if(a===38)cells=sl.map((c,i)=>[c,R[a+i]]);
  cells.forEach(x=>{h+=x?`<button class="cell" onclick="say('${x[0]}')"><b>${x[0]}</b><span>${x[1]}</span></button>`:'<div class="cell empty"></div>'});
 });
 return h+'</div>';
}
function render(){
 const t=T[L];
 $("#sub").textContent=t.sub;$("#note").textContent=t.note;
 $("#nav").innerHTML=["trail","course","hira","kata","kanji","quiz","ex","tips"].map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${t[k]||(k==='ex'?'Exercícios':k==='trail'?'🗺 Trilha':CL[L])}</button>`).join("");
 let v="";
 if(tab==="trail")v=trailView();
 else if(tab==="course")v=courseView();
 else if(tab==="ex")v=exView();
 else if(tab==="hira")v=kanaGrid(H);
 else if(tab==="kata")v=kanaGrid(Kt);
 else if(tab==="kanji"&&kmode==="cards")v=kanjiTop()+cardView()+"<div id='pw'>"+(kp?practiceView():'')+"</div>";
 else if(tab==="kanji")v=kanjiList();
 else if(tab==="kanji_old")v='<div class="kgrid">'+K.map((k,i)=>`<button class="k" style="text-align:left" onclick="kOpen(${i})"><b>${k[0]}</b><strong>${k[LI[L]]}</strong><small>${t.on}: ${k[4]}</small><small>${t.kun}: ${k[5]}</small></button>`).join("")+'</div>';
 else if(tab==="tips")v='<div class="panel"><ul class="tips">'+t.tl.map(x=>`<li>${x}</li>`).join("")+'</ul></div>';
 else {v=`<div class="panel"><div style="margin-bottom:8px">`+["hira","kata","kanji"].map(k=>`<button class="${k===qset?'on':''}" style="${k===qset?'background:var(--ac);color:#fff':''}" onclick="qset='${k}';score=0;total=0;newQ()">${t[k]}</button>`).join(" ")+`</div><div class="big" id="qc"></div><div class="opts" id="qo"></div><div>${t.score}: <b id="sc"></b> <button id="nx" onclick="newQ()" style="margin-left:10px">${t.next}</button></div></div>`}
 $("#view").innerHTML=v;
 if(tab==="quiz")newQ();
}
function newQ(){
 let pool;
 if(qset==="kanji")pool=K.map(k=>[k[0],k[LI[L]]]);
 else{const a=qset==="hira"?H:Kt;pool=a.map((c,i)=>[c,R[i]])}
 const ans=pool[Math.floor(Math.random()*pool.length)];
 const o=[ans];
 while(o.length<4){const x=pool[Math.floor(Math.random()*pool.length)];if(!o.includes(x))o.push(x)}
 o.sort(()=>Math.random()-.5);
 q=ans;
 $("#qc").textContent=ans[0];
 $("#qo").innerHTML=o.map((x,i)=>`<button data-i="${i}">${x[1]}</button>`).join("");
 $("#sc").textContent=score+"/"+total;
 document.querySelectorAll("#qo button").forEach((b,i)=>b.onclick=()=>{
  if(b.disabled)return;total++;
  const right=o[i]===ans;if(right){score++;xp(5)}
  document.querySelectorAll("#qo button").forEach((bb,j)=>{bb.disabled=true;if(o[j]===ans)bb.classList.add("ok");else if(bb===b)bb.classList.add("no")});
  $("#sc").textContent=score+"/"+total;say(ans[0]);
 });
}
const CL={pt:"Curso N5",en:"N5 Course",es:"Curso N5"};
const LS=[
{t:"O japonês escrito e os sons",b:"<p>O japonês usa <b>três sistemas</b> juntos: <b>hiragana</b> (palavras japonesas e gramática), <b>katakana</b> (palavras estrangeiras, como コーヒー) e <b>kanji</b> (caracteres chineses que carregam significado, como 日本).</p><p>Os sons são simples: só <b>5 vogais</b> (a, i, u, e, o) e elas sempre soam igual. Não há espaços entre palavras na escrita normal. Comece ouvindo e repetindo cada caractere na aba Hiragana.</p>",v:"あい|ai|amor;いえ|ie|casa;うえ|ue|em cima;あお|ao|azul;おおい|ooi|muito(s)"},
{t:"Hiragana: linhas A, K, S, T, N",b:"<p>Estude em fileiras. Atenção às exceções de pronúncia: <b>し = shi</b>, <b>ち = chi</b>, <b>つ = tsu</b>.</p><p>Dica: escreva cada caractere 10 vezes seguindo a ordem dos traços (de cima para baixo, da esquerda para a direita) e invente uma imagem para cada um.</p>",v:"かき|kaki|caqui;さけ|sake|saquê;すし|sushi|sushi;たこ|tako|polvo;ねこ|neko|gato;いぬ|inu|cachorro;さくら|sakura|cerejeira"},
{t:"Hiragana: linhas H, M, Y, R, W, N",b:"<p><b>ふ = fu</b> (meio entre f e h). O <b>r</b> japonês fica entre r e l, com um toque rápido da língua.</p><p><b>は</b> lê-se “ha”, mas como partícula gramatical lê-se <b>“wa”</b>. O mesmo vale para <b>を</b> (lê-se “o”) e <b>へ</b> (lê-se “e” quando indica direção).</p>",v:"はな|hana|flor;ふね|fune|barco;やま|yama|montanha;みみ|mimi|orelha;りんご|ringo|maçã;さかな|sakana|peixe"},
{t:"Dakuten, combinações e っ",b:"<p><b>Dakuten ゛</b> engrossa o som: k→g, s→z, t→d, h→b (か→が). <b>Handakuten ゜</b> transforma h em p (は→ぱ).</p><p><b>Combinações:</b> き+ゃ = きゃ (kya), し+ゅ = しゅ (shu), ち+ょ = ちょ (cho). O segundo caractere fica pequeno.</p><p><b>っ pequeno</b> dobra a consoante seguinte (きって = kitte). Vogal longa: おおきい = ookii.</p>",v:"がっこう|gakkou|escola;ともだち|tomodachi|amigo;でんわ|denwa|telefone;ごはん|gohan|arroz, refeição;きって|kitte|selo;しゃしん|shashin|foto"},
{t:"Katakana",b:"<p>Katakana tem os mesmos sons do hiragana, com formas mais angulares. É usado para <b>palavras estrangeiras</b>, nomes de estrangeiros e onomatopeias.</p><p>O traço <b>ー</b> alonga a vogal: コーヒー (koohii). Treine na aba Katakana e no Quiz.</p>",v:"コーヒー|koohii|café;テレビ|terebi|televisão;パン|pan|pão;ブラジル|burajiru|Brasil;アイス|aisu|sorvete;ホテル|hoteru|hotel"},
{t:"Cumprimentos básicos",b:"<p>Aprenda estas expressões de uso diário. Em こんにちは e こんばんは, o último は lê-se <b>wa</b>.</p><p>いただきます é dito antes de comer e ごちそうさまでした depois.</p>",v:"おはようございます|ohayou gozaimasu|bom dia;こんにちは|konnichiwa|boa tarde, olá;こんばんは|konbanwa|boa noite;ありがとうございます|arigatou gozaimasu|muito obrigado;すみません|sumimasen|com licença, desculpe;さようなら|sayounara|adeus;いただきます|itadakimasu|(antes de comer);ごちそうさまでした|gochisousama deshita|(depois de comer)"},
{t:"Apresentação: A は B です",b:"<p>Estrutura básica: <b>A は B です</b> = “A é B”. です deixa a frase educada.</p><p>Pergunta: acrescente <b>か</b> no fim: あなたは がくせいですか。<br>Negativa: <b>ではありません</b> (ou じゃありません).</p><p>Exemplo: わたしは ブラジルじんです。= Eu sou brasileiro(a).</p>",v:"わたし|watashi|eu;あなた|anata|você;がくせい|gakusei|estudante;せんせい|sensei|professor(a);ブラジルじん|burajirujin|brasileiro(a);はい|hai|sim;いいえ|iie|não;なまえ|namae|nome"},
{t:"Números de 0 a 10",b:"<p>Os números têm kanji simples: 一二三四五六七八九十. Alguns têm duas leituras: 4 = <b>よん / し</b>, 7 = <b>なな / しち</b>, 9 = <b>きゅう / く</b>. Hoje, prefira よん, なな e きゅう.</p><p>Dinheiro: <b>えん</b> (円). Ex.: ひゃくえん = 100 ienes.</p>",v:"れい / ぜろ|rei / zero|0;いち|ichi|1;に|ni|2;さん|san|3;よん|yon|4;ご|go|5;ろく|roku|6;なな|nana|7;はち|hachi|8;きゅう|kyuu|9;じゅう|juu|10"},
{t:"Partículas essenciais",b:"<p>Partículas marcam a função de cada palavra:</p><ul><li><b>は</b> (wa): tópico. わたしは せんせいです。</li><li><b>の</b>: posse. わたしの ほん = meu livro.</li><li><b>を</b> (o): objeto direto. みずを のみます。</li><li><b>に</b>: destino, hora, lugar de existência. がっこうに いきます。</li><li><b>で</b>: local da ação ou meio. いえで たべます。</li><li><b>と</b>: “e” / “com”. <b>も</b>: “também”.</li></ul>",v:"ほん|hon|livro;みず|mizu|água;いえ|ie|casa;がっこう|gakkou|escola;ともだち|tomodachi|amigo"},
{t:"Verbos na forma ます",b:"<p>A frase japonesa termina com o verbo (ordem sujeito–objeto–verbo): わたしは ごはんを <b>たべます</b>。</p><p>Conjugação educada: <b>ます</b> (presente/futuro), <b>ません</b> (negativo), <b>ました</b> (passado), <b>ませんでした</b> (passado negativo).</p>",v:"たべます|tabemasu|comer;のみます|nomimasu|beber;いきます|ikimasu|ir;きます|kimasu|vir;みます|mimasu|ver;ききます|kikimasu|ouvir, perguntar;します|shimasu|fazer;よみます|yomimasu|ler"},
{t:"Dias da semana e horas",b:"<p>Os dias vêm dos kanji dos elementos: 日 sol, 月 lua, 火 fogo, 水 água, 木 árvore, 金 ouro, 土 terra + <b>ようび</b> (曜日).</p><p>Horas: número + <b>じ</b>. いま なんじですか。= Que horas são? Ex.: さんじ = 3 horas.</p>",v:"にちようび|nichiyoubi|domingo;げつようび|getsuyoubi|segunda;かようび|kayoubi|terça;すいようび|suiyoubi|quarta;もくようび|mokuyoubi|quinta;きんようび|kinyoubi|sexta;どようび|doyoubi|sábado;いま|ima|agora;なんじ|nanji|que horas"},
{t:"Demonstrativos: これ・それ・あれ",b:"<p><b>これ</b> (perto de mim), <b>それ</b> (perto de você), <b>あれ</b> (longe de ambos), <b>どれ</b> (qual?). Antes de substantivo: <b>この・その・あの</b> ほん. Lugar: <b>ここ・そこ・あそこ・どこ</b>.</p><p>これは なんですか。→ それは ほんです。<br>それは だれの かばんですか。= De quem é essa bolsa?</p>",v:"これ|kore|este;それ|sore|esse;あれ|are|aquele;どれ|dore|qual;ここ|koko|aqui;そこ|soko|aí;あそこ|asoko|ali;どこ|doko|onde;なん|nan|o quê;だれ|dare|quem"},
{t:"Adjetivos い e な",b:"<p><b>Adjetivo い</b> termina em い: おおきい. Antes de substantivo fica igual (おおきい いえ). Negativo: い→<b>くない</b> (おおきくない). Exceção: いい→よくない.</p><p><b>Adjetivo な</b> usa な antes de substantivo: しずかな まち. Negativo: しずかでは ありません.</p>",v:"おおきい|ookii|grande;ちいさい|chiisai|pequeno;あたらしい|atarashii|novo;ふるい|furui|velho;たかい|takai|alto, caro;やすい|yasui|barato;おいしい|oishii|gostoso;たのしい|tanoshii|divertido;しずか|shizuka|quieto;きれい|kirei|bonito, limpo;げんき|genki|saudável;ゆうめい|yuumei|famoso"},
{t:"あります・います e posições",b:"<p><b>あります</b> para coisas, <b>います</b> para pessoas e animais. Estrutura: <b>Lugar に Coisa が あります</b>.</p><p>つくえの うえに ほんが あります。<br>にわに ねこが います。<br>Negativo: ありません・いません.</p><p>Posição: <b>Nの うえ・した・なか・まえ・うしろ・となり</b>.</p>",v:"うえ|ue|em cima;した|shita|embaixo;なか|naka|dentro;まえ|mae|frente;うしろ|ushiro|atrás;となり|tonari|ao lado;つくえ|tsukue|mesa;いす|isu|cadeira;にわ|niwa|jardim"},
{t:"Passado: です e adjetivos",b:"<p><b>です → でした</b>; <b>ではありません → ではありませんでした</b>.</p><p>Adjetivo い: い→<b>かった</b> (あつかったです); negativo: <b>くなかった</b>. Adjetivo な: しずかでした.</p><p>きのうは あつかったです。= Ontem estava quente.</p>",v:"きのう|kinou|ontem;きょう|kyou|hoje;あした|ashita|amanhã;あつい|atsui|quente;さむい|samui|frio;ひま|hima|livre;いそがしい|isogashii|ocupado;むずかしい|muzukashii|difícil;やさしい|yasashii|fácil, gentil"},
{t:"Contadores e preços",b:"<p>Coisas: <b>ひとつ・ふたつ・みっつ…とお</b>. Pessoas: <b>ひとり・ふたり・さんにん</b>. Folhas: ～<b>まい</b>. Idade: ～<b>さい</b>. Preço: ～<b>えん</b>.</p><p>これは いくらですか。→ ひゃくえんです。</p>",v:"ひとつ|hitotsu|1 coisa;ふたつ|futatsu|2 coisas;みっつ|mittsu|3 coisas;ひとり|hitori|1 pessoa;ふたり|futari|2 pessoas;さんにん|sannin|3 pessoas;いちまい|ichimai|1 folha;いっさい|issai|1 ano de idade;はたち|hatachi|20 anos;いくら|ikura|quanto custa"},
{t:"Calendário e datas",b:"<p>Meses: número + <b>がつ</b> (いちがつ…じゅうにがつ; 4 = しがつ, 7 = しちがつ, 9 = くがつ). Dias do mês têm leituras especiais até o dia 10.</p><p>たんじょうびは さんがつ じゅうごにちです。= Meu aniversário é 15 de março.</p>",v:"いちがつ|ichigatsu|janeiro;じゅうにがつ|juunigatsu|dezembro;ついたち|tsuitachi|dia 1;ふつか|futsuka|dia 2;みっか|mikka|dia 3;よっか|yokka|dia 4;いつか|itsuka|dia 5;とおか|tooka|dia 10;たんじょうび|tanjoubi|aniversário;らいしゅう|raishuu|semana que vem;きょねん|kyonen|ano passado"},
{t:"Forma て",b:"<p>Muito usada no N5. Regras:</p><ul><li>Grupo 1: う・つ・る→<b>って</b> (かう→かって); む・ぶ・ぬ→<b>んで</b> (のむ→のんで); く→<b>いて</b> (かく→かいて; いく→いって); ぐ→<b>いで</b>; す→<b>して</b></li><li>Grupo 2: る→<b>て</b> (たべる→たべて)</li><li>する→して, くる→きて</li></ul><p>Usos: <b>～てください</b> (por favor faça), <b>～ています</b> (está fazendo), sequência de ações (あさ おきて、ごはんを たべます).</p>",v:"かって|katte|comprar (て);のんで|nonde|beber (て);かいて|kaite|escrever (て);いって|itte|ir (て);たべて|tabete|comer (て);みて|mite|ver (て);して|shite|fazer (て);きて|kite|vir (て)"},
{t:"Forma ない e たい",b:"<p><b>Forma ない</b> (negativo informal): grupo 1: última sílaba vira o som あ + ない (かく→かかない; かう→かわない); grupo 2: る→ない (たべない); する→しない; くる→こない.</p><p><b>～ないでください</b> = por favor, não faça.</p><p><b>～たい</b> = querer fazer (たべたい); <b>～が ほしい</b> = querer um objeto.</p>",v:"かかない|kakanai|não escrever;たべない|tabenai|não comer;しない|shinai|não fazer;こない|konai|não vir;たべたい|tabetai|quero comer;いきたい|ikitai|quero ir;ほしい|hoshii|desejar (algo)"},
{t:"Convites, から・まで e comparações",b:"<p>Convite: <b>～ませんか</b> (Que tal?) e <b>～ましょう</b> (Vamos!). いっしょに いきませんか。→ いいですね。</p><p><b>から</b> = de, desde; <b>まで</b> = até: くじから ごじまで。<br><b>A は B より ～</b> = A é mais ... que B. <b>いちばん</b> = o mais.</p><p>Gostos: <b>～が すき・きらい・じょうず・へた</b>.</p>",v:"いっしょに|issho ni|juntos;すき|suki|gostar;きらい|kirai|não gostar;じょうず|jouzu|habilidoso;へた|heta|ruim em;から|kara|de, desde;まで|made|até;より|yori|do que;いちばん|ichiban|o mais"},
{t:"Vocabulário temático",b:"<p>Família (a sua: ちち, はは; a dos outros: おとうさん, おかあさん), cores, comida e lugares aparecem muito na prova. Revise lendo em voz alta.</p>",v:"ちち|chichi|meu pai;はは|haha|minha mãe;あに|ani|meu irmão mais velho;あね|ane|minha irmã mais velha;おとうと|otouto|irmão mais novo;いもうと|imouto|irmã mais nova;あか|aka|vermelho;あお|ao|azul;しろ|shiro|branco;くろ|kuro|preto;たまご|tamago|ovo;にく|niku|carne;やさい|yasai|verdura;おちゃ|ocha|chá;えき|eki|estação;びょういん|byouin|hospital;ぎんこう|ginkou|banco;としょかん|toshokan|biblioteca;でんしゃ|densha|trem;くるま|kuruma|carro"},
{t:"Kanji N5 (1): números e tempo",b:"<p>Aprenda kanji dentro de palavras. Leituras: minúsculas = kun (japonesa), katakana = on (chinesa).</p>",v:"百|ヒャク|cem;千|セン|mil;万|マン|dez mil;円|エン|iene;年|とし・ネン|ano;時|ジ|hora;分|フン・ブン|minuto;半|ハン|metade;今|いま・コン|agora;毎|マイ|todo;週|シュウ|semana;前|まえ・ゼン|antes;後|あと・ゴ|depois;間|あいだ・カン|intervalo;何|なに・カ|o quê"},

const sh=a=>a.map(x=>[Math.random(),x]).sort((p,r)=>p[0]-r[0]).map(x=>x[1]);
const uq=a=>[...new Set(a)];
const Q=(q,a,w,e,s)=>({q,a,o:sh([a,...w]),e,s});
const rowsOf=(a,b)=>LS.slice(a,b).flatMap(l=>l.v.split(';').map(x=>x.split('|'))).filter(r=>r.length>2&&r[0]);
function mkV(a,b,lis,n){const pool=rowsOf(a,b);return sh(pool).slice(0,n).map(r=>{const ot=pool.filter(x=>x[2]!==r[2]&&x[0]!==r[0]);if(lis)return Q('🔊 Ouça e escolha',r[0],uq(sh(ot).map(x=>x[0])).slice(0,3),r[0]+' ('+r[1]+') = '+r[2],r[0]);return Q(r[0],r[2],uq(sh(ot).map(x=>x[2])).slice(0,3),r[0]+' ('+r[1]+')')})}
function mkP(n){return sh(PQ).slice(0,n).map(s=>{const[q,a,e]=s.split('|');return Q(q,a,sh(['は','の','を','に','で','と','も','が','から'].filter(x=>x!==a)).slice(0,3),e)})}
function mkG(n){return sh(GQ).slice(0,n).map(s=>{const[q,a,w,e]=s.split('|');return Q(q,a,w.split(','),e)})}

 if((t&&kw.res)||(!t&&kw.ok))s+=` <button onclick='kwNext()' style='background:var(--ac);color:#fff'>${last?'Ver resultado':'Próximo →'}</button>`;
 s+='</p>';
 if(!t)s+=`<p><a href='https://www.google.com/search?q=${encodeURIComponent(c+' 書き順 hiragana')}' target='_blank' rel='noopener' style='color:var(--ac)'>Ver a ordem dos traços ↗</a></p>`;
 o.innerHTML=s+'</div></div>'}
function kwD(e){e.preventDefault();if(kw.res||(kw.m==='p'&&kw.ok))return;kw.cur=[kwPt(e)];try{$('#kwsv').setPointerCapture(e.pointerId)}catch(x){}$('#kwpc').setAttribute('d',pathOf(kw.cur))}
function kwM(e){if(!kw.cur)return;kw.cur.push(kwPt(e));$('#kwpc').setAttribute('d',pathOf(kw.cur))}
function kwU(e){
 if(!kw.cur)return;const a=kw.cur;kw.cur=null;
 if(a.length<3){kwShow();return}
 const c=kw.l[kw.i],N=SC[c],d=pathOf(a);
 if(kw.m==='t'){if(kw.done.length<N+3){kw.done.push(d);kw.pts.push(a)}kwShow();return}
 if(strokePrec(a,c)<0.6){kw.msg='Esse traço não segue o modelo. Tente de novo.';kwShow();return}
 if(!dirOK(a)){kw.msg='Direção estranha: da esquerda para a direita e de cima para baixo.';kwShow();return}
 kw.done.push(d);kw.pts.push(a);
 if(kw.done.length>=N){if(kwCov(c)>=0.5){kw.ok=true;kw.sc++;kw.msg='✅ Muito bem!';xpOnce('kwp'+c,3)}else kw.msg='Faltou cobrir parte do caractere. Toque em 🗑 e tente de novo.'}
 else kw.msg='Traço '+kw.done.length+' de '+N+'.';
 kwShow()}
function kwCheck(){
 const c=kw.l[kw.i],N=SC[c];if(!kw.done.length)return;
 const good=kw.pts.map(a=>dirOK(a)&&strokePrec(a,c)>=0.7),cv=kwCov(c),okc=good.filter(Boolean).length,perfect=kw.done.length===N&&okc===N&&cv>=0.55;
 if(perfect){kw.sc++;xpOnce('kwt'+c,5)}
 kw.res={good};kw.msg=perfect?'Certo! ✅ (cobertura '+Math.round(cv*100)+'%)':`Traços certos: ${okc}/${kw.done.length}. O caractere tem ${N} traços. Cobertura: ${Math.round(cv*100)}%. Em vermelho: fora do lugar ou na direção errada.`;kwShow()}
function kwNext(){kw.i++;if(kw.i>=kw.l.length)kw.fin=true;else{kw.done=[];kw.pts=[];kw.res=null;kw.msg='';kw.ok=false;if(kw.m==='t')say(kw.l[kw.i])}kwShow()}
function kwUndo(){if(kw.res||kw.ok)return;kw.done.pop();kw.pts.pop();kw.msg='';kwShow()}
function kwClear(){if(kw.res)return;kw.done=[];kw.pts=[];kw.ok=false;kw.msg='';kwShow()}
$("#lang").onchange=e=>{L=e.target.value;document.documentElement.lang=L;render()};
render();
</script>
